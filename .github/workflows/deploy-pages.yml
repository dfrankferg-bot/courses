name: Deploy Wanderlog to GitHub Pages

on:
  push:
    branches: [claude/wanderlog-app-recreation-u9uju6]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
        working-directory: wanderlog
      - name: Build (served from /courses/)
        run: npm run build -- --base=/courses/
        working-directory: wanderlog
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wanderlog/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
